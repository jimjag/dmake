name: DMAKE-basic-check

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        confflags: ['', '--enable-spawn']

    steps:
    - uses: actions/checkout@v4
    - run: ./configure ${{ matrix.confflags }}
    - run: make
    - run: make check
    - run: make distclean
